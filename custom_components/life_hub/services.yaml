# ========== McDonald's (麦当劳) ==========

mcdonalds_call_tool:
  name: 麦当劳 MCP
  description: 调用麦当劳 MCP 工具，支持全部 24 个工具
  fields:
    tool:
      name: 工具
      description: 选择要调用的麦当劳 MCP 工具
      required: true
      selector:
        select:
          options:
            - "query-my-coupons"
            - "available-coupons"
