# Life Hub Services — 统一命名规范
# 所有服务格式: {provider}_call_tool
# 参数统一: tool + params + subentry_id

# ========== Yiming (一鸣) ==========

yiming_call_tool:
  name: 一鸣 API
  description: "通过 tool 选择功能，params 传参数。可选 tool: get_balance, get_member_info, get_coupon_sum, get_integral, claim_all 等 37 种"
  fields:
    tool:
      name: 工具
      description: 选择要调用的 API 方法
      required: true
      selector:
        select:
          options:
            - "get_balance"
            - "get_member_info"
            - "get_coupon_sum"
            - "get_integral"
            - "get_user_info"
            - "get_app_notice"
            - "get_coupon_pools"
            - "get_orders"
            - "get_my_coupons"
            - "get_integral_detail"
            - "get_recharge_list"
            - "get_app_equity"
            - "get_user_info_v2"
            - "get_qrcode"
            - "get_order"
            - "get_transaction_details"
            - "get_default_address"
            - "get_nearest_store"
            - "get_menu"
            - "get_sku_info"
            - "search_stores"
            - "get_delivery_time"
            - "get_nearby_addresses"
            - "get_store_info"
            - "get_region_list"
            - "get_current_city"
            - "query_nearly_store"
            - "query_nearly_store_by_distance"
            - "get_nearly_store_one_km"
            - "calculate_cart"
            - "pre_create_order"
            - "submit_order"
            - "receive_all_coupons"
            - "receive_coupon"
            - "claim_all"
            - "collect_store_query"
            - "collect_store_create"
    params:
      name: 参数
      description: 工具参数（JSON对象），根据 tool 不同传入不同参数
      required: false
      selector:
        object:
    subentry_id:
      name: 子条目ID
      description: 指定操作哪个账号（多账号时使用，留空操作第一个）
      required: false
      selector:
        text:

# ========== Fliggy (飞猪) ==========

fliggy_call_tool:
  name: 飞猪 API
  description: "通过 tool 选择功能，params 传参数。可选 tool: fast_search, search_flight, search_hotel, search_train 等"
  fields:
    tool:
      name: 工具
      description: 选择要调用的功能
      required: true
      selector:
        select:
          options:
            - "fast_search"
            - "ai_search"
            - "search_flight"
            - "search_hotel"
            - "search_train"
            - "search_poi"
            - "search_marriott_hotel"
            - "search_marriott_package"
    params:
      name: 参数
      description: "工具参数（JSON对象）。例如 search_flight 需要 {\"origin\": \"北京\", \"destination\": \"上海\", \"dep_date\": \"2026-08-01\"}"
      required: false
      selector:
        object:
    subentry_id:
      name: 子条目ID
      description: 指定操作哪个账号
      required: false
      selector:
        text:

