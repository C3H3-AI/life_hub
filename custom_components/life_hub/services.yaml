            - "query-my-account"
            - "query-store-coupons"
            - "query-nearby-stores"
            - "query-meals"
            - "query-meal-detail"
            - "query-meal-assistance"
            - "query-order"
            - "order-list"
            - "create-order"
            - "calculate-price"
            - "now-time-info"
            - "list-nutrition-foods"
            - "campaign-calendar"
            - "delivery-create-address"
            - "delivery-query-addresses"
            - "delivery-query-stores"
            - "mall-create-order"
            - "mall-order-list"
            - "mall-order-detail"
            - "mall-points-products"
            - "mall-product-detail"
    params:
      name: 参数
      description: 工具参数（JSON对象）。无参数工具传 {}
      required: false
      default: "{}"
      selector:
        object:
    subentry_id:
      name: 子条目ID
      description: 指定操作哪个麦当劳账号（多账号时使用）
      required: false
      selector:
        text:

